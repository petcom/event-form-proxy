
# nginx configuration for andrewsmixer.sonaraz.com-ssl.conf
server {
      listen 443 ssl http2;
      listen [::]:443 ssl http2;

      server_name andrewsmixer.sonaraz.com;

      root /var/www/andrewsmixer;
      index index.html;

      ssl_certificate     /etc/letsencrypt/live/andrewsmixer.sonaraz.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/andrewsmixer.sonaraz.com/privkey.pem;
      include /etc/nginx/snippets/ssl-params.conf;

      # Audio proxy - route to Express server at localhost:8180
      location /audio-mixer/ {
          proxy_pass http://localhost:8180/audio-mixer/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          # Audio streaming support
          proxy_buffering off;
          proxy_cache off;
          proxy_request_buffering off;
      }

      # SPA routing
      location / {
          try_files $uri /index.html;
      }

      # ES6 module support - CRITICAL for the mixer to work
      location ~* \.js$ {
          add_header Content-Type application/javascript;
          expires 1y;
          add_header Cache-Control "public, immutable";
      }

      # CSS files
      location ~* \.css$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
      }

      # JSON manifests
      location ~* \.json$ {
          add_header Content-Type application/json;
          expires 1h;
      }

      # Audio files
      #location ~* \.(mp3|wav|ogg)$ {
      #    expires 1y;
      #    add_header Cache-Control "public, immutable";
      #    add_header Access-Control-Allow-Origin "*";
      #}

      location ~ /.well-known {
          allow all;
      }

      client_max_body_size 1g;
  }